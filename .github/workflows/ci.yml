name: Quality Checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Validate on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['24.16.0', '24.21.0']

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record timezone runtime
        run: node -p "JSON.stringify({node:process.version,icu:process.versions.icu,tz:process.versions.tz})"

      - name: Run lint
        run: npm run lint

      - name: Run reliability tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check optional worker dependency advisories
        run: npm audit --omit=dev --prefix worker --audit-level=moderate

  wordpress-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:wordpress

  ui-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-failure-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
